# TrueNAS SCALE: Apps -> Discover -> Custom App (chevron) -> Install via YAML.
# CPU only; the model and voice packs are baked into the image, so no volume or download is needed.
#
# Voices: --voice NAME=VOICE[:WEIGHT],... builds a named voice from a weighted blend of Kokoro
# voice packs; the first one is the default. Stock ids (e.g. pf_dora) can also be requested directly.
services:
  kokoro:
    image: ghcr.io/lfventura/wyoming-kokoro:1.0.0
    container_name: wyoming-kokoro
    restart: unless-stopped
    user: "3016:3017"
    command:
      - --voice
      - santa_adam=pm_santa:0.7,am_adam:0.3
      - --voice
      - dora_heart=pf_dora:0.5,af_heart:0.5
    ports:
      - 10200:10200
